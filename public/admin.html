<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · NImpatech</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><main class="wrap admin-shell"><div class="admin-heading"><div><p class="kicker">Private admin space</p><h1>Customer activity</h1><p class="lead">Every checkout attempt, payment, and delivery status in one view.</p></div><button class="btn btn-ghost" id="logout" hidden>Log out</button></div>
<section class="panel" id="login-panel"><h2>Admin login</h2><p class="lead">Use the admin dashboard token configured for this deployment.</p><form id="login-form"><label for="admin-token">Admin token</label><input id="admin-token" type="password" required autocomplete="current-password"><p class="error" id="login-error"></p><button class="primary" type="submit">Open dashboard</button></form></section>
<section id="dashboard" hidden><div class="admin-stats" id="admin-stats"></div><div class="panel admin-table-panel"><div class="admin-table-tools"><h2>All checkout attempts</h2><button class="btn btn-ghost" id="refresh">Refresh</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Customer</th><th>Bundle</th><th>Amount</th><th>Payment</th><th>Delivery</th><th>Order</th></tr></thead><tbody id="orders-body"></tbody></table></div><p class="error" id="dashboard-error"></p></div></section></main><script src="/js/theme.js" defer></script><script src="/js/admin.js" defer></script></body></html>
